<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webfolder</title>
    <link rel="stylesheet" href="real.css" />
    <script type="module" src="real.mjs"></script>
  </head>
  <body>
    <header class="header">
      <div class="header__side header__side--left">
        <div class="header__logo">Webfolder</div>
        <!-- todo: accessibility -->
        <div class="header__path">
          <!-- <div class="header__path--preview">
            <button class="header__path--dir" type="button">C:</button>
            /
            <button class="header__path--dir" type="button">Windows</button>
            /
            <button class="header__path--dir" type="button">System32</button>
          </div> -->
          <input class="header__path__input" type="text" value="/" />
        </div>
      </div>
      <div class="header__side header__side--right">
        <!-- TODO: search menu -->
        <button class="header__search" type="button">
          <svg class="header__search--icon">
            <use href="./shared/components/icons.svg#search"></use>
          </svg>
          <div class="header__search--highlight"></div>
        </button>

        <!-- TODO: settings menu -->
        <button class="header__settings" type="button">
          <svg class="header__settings--icon">
            <use href="./shared/components/icons.svg#settings"></use>
          </svg>
          <div class="header__settings--highlight"></div>
        </button>
      </div>
    </header>
    <main class="main">
      <aside class="sidebar">
        <div class="sidebar__quickmenu">
          <header class="sidebar__quickmenu__header">Быстрый доступ</header>
          <a class="sidebar__quickmenu__item" href="#home">Главная</a>
          <a class="sidebar__quickmenu__item" href="#recent">Недавние</a>
        </div>

        <!-- <div class="sidebar__info">
          <div class="sidebar__storage"></div>
        </div> -->
        <!-- <div class="sidebar__mountmenu">
          <div class="sidebar__mount">C:</div>
          <div class="sidebar__mount">D:</div>
        </div> -->
      </aside>
      <main class="browser">
        <table class="browser__view">
          <thead class="browser__header">
            <th><input type="checkbox" class="browser__selectall" /></th>
            <th>Имя</th>
            <th>Дата изменения</th>
            <th>Тип</th>
            <th>Размер</th>
          </thead>
          <tbody class="browser__main"></tbody>
        </table>
        <template id="browser__entry__template">
          <tr class="browser__entry">
            <td class="centered">
              <input type="checkbox" class="browser__entry__select" />
            </td>
            <td>
              <input
                class="browser__entry__name"
                type="text"
                value="Windows"
                disabled
              />
            </td>
            <td class="browser__entry__mtime centered">15.04.2026 13:32</td>
            <td class="browser__entry__type centered">Папка</td>
            <td class="browser__entry__size centered"></td>
          </tr>
        </template>
      </main>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
